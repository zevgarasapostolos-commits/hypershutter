# Default proxy: what Premiere's "Attach Proxies" expects from a 4K wedding camera.
name: ProRes Proxy 1080p
container: mov
width: 1920
video:
  encoder: prores_videotoolbox      # Apple silicon ProRes engine
  args: ["-profile:v", "proxy"]
  fallback: prores_ks
  fallback_args: ["-profile:v", "0"]
audio:
  args: ["-c:a", "pcm_s16le"]
estimate:
  mbps_per_fps: 1.55                # measured on a real card: 76.7 Mb/s on average at 1080p 50, video + PCM audio
size_ratio: 0.42                    # proxy size / source size, only when a clip's length cannot be read
