# Wedding (γάμος) — HINTS ONLY, never a fixed list. Same principles as baptisms.
# Source: docs/workflow-organizing.md §4.3 and docs/workflow-baptism.md Appendix E.

event_type: wedding

naming:
  number_format: "{n:02d}"
  sub_letter: "a"
  flow_suffix: "ΡΟΗ"
  broll_suffix: "B-ROLL"
  separator: " — "
  unusable: { number: 99, label: "ΑΧΡΗΣΤΑ" }
  contact_sheets_dir: "00 CONTACT SHEETS"
  index_label: "ΕΥΡΕΤΗΡΙΟ ΠΛΑΝΩΝ"
  greeklish_style: { upsilon: "Y", au_eu: "phonetic", xi: "KS", mp_nt: "literal" }

typical_parts:
  - label: "ΧΩΡΙΟ & ΤΟΠΟΘΕΣΙΑ"
    cues: "the village / town / landscape itself (streets, sea, views); not the church, which goes with the arrival"
  - label: "ΛΕΠΤΟΜΕΡΕΙΕΣ (ΔΑΧΤΥΛΙΔΙΑ, ΠΑΠΟΥΤΣΙΑ)"
    cues: "ONE folder for the details of both bride and groom: rings, shoes, dress on hanger, perfume, cufflinks, invitation"
  - label: "ΕΤΟΙΜΑΣΙΑ ΓΑΜΠΡΟΥ"
    cues: "groom getting ready, shaving, friends, family at the groom's house"
  - label: "ΕΤΟΙΜΑΣΙΑ ΝΥΦΗΣ"
    cues: "bride getting ready, make-up, dress, bridesmaids"
  - label: "ΝΥΦΗ ΜΙΛΑΕΙ ΣΤΗΝ ΚΑΜΕΡΑ"
    cues: "only when asked: bride looks straight into the lens and talks"
  - label: "ΕΚΚΛΗΣΙΑ & ΑΦΙΞΗ ΚΟΣΜΟΥ"
    cues: "ONE part: church exterior, interior and its decor, guests arriving, the groom waiting, the couple's arrival"
  - label: "ΓΑΜΟΣ"
    split: true
    cues: "ceremony: rings (αρραβώνας), crowns (στέφανα), Apostle, Gospel, common cup (κοινό ποτήριο), «Ησαΐα χόρευε», dismissal"
  - label: "ΓΑΜΟΣ — ΕΞΟΔΟΣ & ΕΥΧΕΣ"
    cues: "leaving the church, rice, wishes at the door"
  - label: "ΒΑΦΤΙΣΗ"
    split: true
    cues: "only when a baptism happens the same day (γαμοβάφτιση): ONE ceremony pair ΒΑΦΤΙΣΗ — ΡΟΗ / B-ROLL that includes the catechism (no separate ΚΑΤΗΧΗΣΗ); posed family shots with the baby before it go to «ΟΙΚΟΓΕΝΕΙΑΚΑ ΜΕ ΤΟ ΜΩΡΟ»"
  - label: "ΦΩΤΟΓΡΑΦΗΣΗ ΖΕΥΓΑΡΙΟΥ"
    cues: "couple photo session; add the theme if clear, e.g. (ΒΕΣΠΑ)"
  - label: "ΔΕΞΙΩΣΗ — ΣΤΟΛΙΣΜΟΣ"
    cues: "the reception venue and its decoration before the party: set tables, centrepieces, banners, empty venue"
  - label: "ΔΕΞΙΩΣΗ — ΚΟΣΜΟΣ & ΦΑΓΗΤΟ"
    cues: "guests at the tables, food, drinks, the couple among the guests (a separate folder from the decor at weddings)"
  - label: "ΧΟΡΟΣ"
    cues: "ALL dancing in one folder, including the couple's entrance and first dance, and the DJ / band during the party"
  - label: "ΕΥΧΕΣ - ΣΥΝΕΝΤΕΥΞΕΙΣ"
    cues: "guests talking to camera / interviews"
  - label: "DRONE"

rules:
  - "Same rules as baptism.yaml: timeline first, then clip by clip; ceremony time window decides membership; posed vs candid; ΡΟΗ masters never in B-ROLL."
  - "An event can be a wedding AND a baptism on the same day: then build both ceremony sets (ΓΑΜΟΣ ΡΟΗ/B-ROLL and ΒΑΦΤΙΣΗ ΡΟΗ/B-ROLL)."
  - "A folder named CLIP2 is not necessarily a second camera: if numbering continues without a gap and codec/resolution match, it is the same camera on another card or day."
  - "With a single camera there may be no B-ROLL for the ceremony at all; say so explicitly."
  - "Material from another day (e.g. a baby studio shoot) gets its own folder with the date in the name."
  - "Every posed group and every party shot belongs somewhere: nothing is thrown away (docs/workflow-baptism.md, Appendix E)."
