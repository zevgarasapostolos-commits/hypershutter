<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HyperShutter</title>
  <link rel="icon" href="/ui/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/ui/css/tokens.css">
  <link rel="stylesheet" href="/ui/css/app.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><img class="mark" src="/ui/img/mark.svg" alt=""><span class="wordmark">HYPERSHUTTER</span></div>
    <nav class="nav">
      <button class="nav-item" data-view="home" data-i18n="nav.home"></button>
      <button class="nav-item" data-view="ingest" data-i18n="nav.ingest"></button>
      <button class="nav-item" data-view="analyze" data-i18n="nav.analyze"></button>
      <button class="nav-item" data-view="review" data-i18n="nav.review"></button>
      <button class="nav-item" data-view="export" data-i18n="nav.export"></button>
      <button class="nav-item" data-view="drives" data-i18n="nav.drives"></button>
      <button class="nav-item" data-view="lab" data-i18n="nav.lab"></button>
      <div class="nav-sep"></div>
      <button class="nav-item minor" data-view="settings" data-i18n="nav.settings"></button>
      <button class="nav-item minor" data-view="features" data-i18n="nav.features"></button>
      <button class="nav-item minor" data-view="help" data-i18n="nav.help"></button>
      <button class="nav-item minor" data-view="about" data-i18n="nav.about"></button>
    </nav>
    <div class="side-status" id="side-status" aria-live="polite"></div>
    <div class="sidebar-foot">
      <div class="lang" role="group">
        <button data-lang="en">EN</button><button data-lang="el">ΕΛ</button>
      </div>
      <div class="version" id="version"></div>
    </div>
  </aside>
  <main id="view" class="view"></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <p id="modal-text"></p>
      <div id="modal-extra" hidden>
        <p id="modal-hint" class="hint"></p>
        <label class="toggle modal-check"><input type="checkbox" id="modal-check"><span id="modal-check-label"></span></label>
        <p id="modal-check-hint" class="hint"></p>
      </div>
      <div class="modal-actions">
        <button class="btn" id="modal-cancel" data-i18n="common.cancel"></button>
        <button class="btn primary" id="modal-ok" data-i18n="common.ok"></button>
      </div>
    </div>
  </div>
  <script src="/ui/js/api.js"></script>
  <script src="/ui/js/i18n.js"></script>
  <script src="/ui/js/app.js"></script>
  <script src="/ui/js/screens.js"></script>
</body>
</html>
