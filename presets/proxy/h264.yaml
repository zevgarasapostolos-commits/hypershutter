# Small proxies for a laptop or for sending: H.264 720p.
name: H.264 720p
container: mov
width: 1280
video:
  encoder: h264_videotoolbox
  args: ["-b:v", "5M", "-pix_fmt", "yuv420p"]
  fallback: libx264
  fallback_args: ["-crf", "23", "-preset", "veryfast", "-pix_fmt", "yuv420p"]
audio:
  args: ["-c:a", "aac", "-b:a", "192k"]
estimate:
  mbps: 5.2                         # 5 Mb/s video + 192 kb/s audio
size_ratio: 0.06                    # proxy size / source size, only when a clip's length cannot be read
