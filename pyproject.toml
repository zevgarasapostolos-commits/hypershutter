[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hypershutter"
version = "0.1.0"
description = "Ingest, archiving and automatic sorting of wedding videography footage."
requires-python = ">=3.12"

[project.scripts]
hypershutter = "hypershutter.cli:main"

[tool.setuptools.packages.find]
include = ["hypershutter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
